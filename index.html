<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Norns Manual</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Press+Start+2P&display=swap">
<style>
/* VOICE: a hardware reference card, terse and dense, read at a glance mid-play
   IDEA: the Microcosm effects map: CAD wireframe panels, corner brackets, scanlines
   PICTURE: the app's grid and E16 drawn as a wireframe board, keys lit in neon
   COLOUR and TYPE: near black, cream text, amber UI, one neon accent per app; Space Mono, Press Start 2P title
   LAYOUT: slim sticky bar with search and apps; board left (sticky), answers right */
:root{color-scheme:dark;
  --bg:#0A0908;--scan:rgba(255,255,255,.012);--card:#100E0C;--card2:#16130F;--line:#3A2E1E;
  --cream:#EDE3C8;--dim:#8A8270;--amber:#FF9A2E;--amberd:#8A5619;
  --cyan:#3ADCEA;--green:#39FF7A;--red:#FF4433;--yellow:#FFD23A;--pink:#FF5FA2;--violet:#A98BFF;
  --acc:var(--amber);
  --g-step:var(--cyan);--g-page:var(--amber);--g-mode:var(--green);--g-nav:var(--dim);--g-temp:var(--pink);--g-rec:var(--red);--g-alt:var(--violet);
  --g-pattern:#2FB8A8;--g-cycle:var(--yellow);--g-fx:var(--amber);--g-key:var(--cyan);--g-play:var(--green);--g-danger:var(--red);--g-loom:var(--cyan);
  --fm:"Space Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}html{scroll-padding-top:var(--bartop,70px)}
body{color:var(--cream);font:12px/1.5 var(--fm);overflow-x:clip;padding-bottom:60px;
  background-image:repeating-linear-gradient(180deg,var(--scan) 0,var(--scan) 1px,transparent 1px,transparent 3px)}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:1px solid var(--acc);outline-offset:2px}
.page{margin:0 auto;padding:0 22px}
/* bar */
.bar{position:sticky;top:0;z-index:5;background:rgba(10,9,8,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(4px)}
.barin{margin:0 auto;padding:10px 18px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
h1{font:400 14px/1.3 "Press Start 2P",var(--fm);color:var(--amber);margin:0;white-space:nowrap}
.search{position:relative;flex:1 1 280px;max-width:520px}
.search input{width:100%;font:400 16px var(--fm);padding:7px 34px 7px 10px;background:var(--card);border:1px solid var(--line);color:var(--cream);border-radius:0}
.search input::placeholder{color:var(--dim)}
.search input:focus{outline:none;border-color:var(--amber)}
.search button{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;background:none;color:var(--dim);font-size:16px;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-size:11px;letter-spacing:.06em;padding:6px 10px;background:none;border:1px solid var(--line);color:var(--cream);cursor:pointer;text-transform:uppercase}
.chips button:hover{border-color:var(--amberd)}
.chips button[aria-pressed=true]{border-color:var(--c,var(--amber));color:var(--c,var(--amber));background:color-mix(in srgb,var(--c,var(--amber)) 10%,transparent)}
.tries{width:100%;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.5px;color:var(--dim);letter-spacing:.04em}
.tries span{color:var(--amberd);letter-spacing:.2em}
.tries button{background:none;border:0;padding:0;color:var(--dim);cursor:pointer;font-size:10.5px;border-bottom:1px dotted var(--line)}
.tries button:hover{color:var(--amber)}
/* main layout */
.main{display:flex;flex-direction:column;gap:18px;padding-top:16px}
.frame{position:relative;border:1px solid var(--line);background:var(--card)}
.frame::before,.frame::after,.frame>.c1,.frame>.c2{content:"";position:absolute;width:9px;height:9px;pointer-events:none}
.frame::before{top:-1px;left:-1px;border-top:2px solid var(--fc,var(--amber));border-left:2px solid var(--fc,var(--amber))}
.frame::after{top:-1px;right:-1px;border-top:2px solid var(--fc,var(--amber));border-right:2px solid var(--fc,var(--amber))}
.frame>.c1{bottom:-1px;left:-1px;border-bottom:2px solid var(--fc,var(--amber));border-left:2px solid var(--fc,var(--amber))}
.frame>.c2{bottom:-1px;right:-1px;border-bottom:2px solid var(--fc,var(--amber));border-right:2px solid var(--fc,var(--amber))}
.boardcol{display:flex;flex-direction:column;gap:10px}
.board{padding:12px;--fc:var(--acc)}
.board-in{container-type:inline-size;display:flex;flex-wrap:wrap;gap:16px 2.2%;align-items:flex-start;--k:min(84px,calc((100cqw - 26px) / 17.5));--kn:clamp(44px,calc(var(--k)*1.15),64px)}
@container (min-width:900px){.gridwrap,.e16col{--k:min(84px,calc((100cqw - 90px) / 21.6));--kn:calc(var(--k)*.92)}}
.gridwrap{flex:0 0 auto;position:relative;padding-bottom:calc(var(--k)*.55)}
.e16col{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;width:calc(var(--kn)*4 + 24px)}


.key{position:relative}
.gl{position:absolute;top:2px;right:2px;font:700 max(9px,calc(var(--k)*.19))/1 var(--fm);color:var(--cream);background:rgba(10,9,8,.55);padding:1px 3px;letter-spacing:.02em;pointer-events:none;white-space:nowrap}
.key .t{margin-top:calc(var(--k)*.12)}
.pair{position:absolute;border:2px solid var(--cream);border-top:0;pointer-events:none;opacity:.85}
.pair span{position:absolute;left:50%;top:100%;transform:translate(-50%,2px);font:700 max(9px,calc(var(--k)*.16))/1 var(--fm);color:var(--cream);letter-spacing:.08em;white-space:nowrap;background:var(--card);padding:1px 4px}
@container (max-width:470px){.gl{font-size:0;width:5px;height:5px;padding:0;border-radius:50%;background:var(--cream);top:2px;right:2px;box-shadow:0 0 3px var(--cream)}.key .t{margin-top:0}.pair span{font-size:7px}}
.key.partner{outline:2px solid var(--acc);outline-offset:1px;box-shadow:0 0 10px var(--acc)}
.knob{position:relative}
.knob .km{position:absolute;top:-4px;right:-4px;font:700 max(9px,calc(var(--kn)*.18))/1 var(--fm);color:var(--cream);background:var(--card);border:1px solid var(--line);padding:1px 3px}
.knob.rec{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--red),0 0 12px color-mix(in srgb,var(--red) 50%,transparent)}
.knob.rec .km{color:var(--red);border-color:var(--red)}
.knob.partner{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc),0 0 12px var(--acc)}
@media(prefers-reduced-motion:no-preference){
  @keyframes breathe{0%,100%{box-shadow:0 0 4px var(--amber);filter:brightness(1)}50%{box-shadow:0 0 18px 3px var(--amber);filter:brightness(1.25)}}
  @keyframes pulse{0%,100%{box-shadow:0 0 2px var(--acc)}50%{box-shadow:0 0 16px 3px var(--acc)}}
  .key.hold{animation:breathe 1.6s ease-in-out infinite}
  .key.partner,.knob.partner{animation:pulse 1.4s ease-in-out infinite}
  .knob.rec{animation:none}}
.key.zone{outline:1px dashed var(--acc);outline-offset:1px}
.info{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.moves{list-style:none;margin:0;padding:0;columns:2 420px;column-gap:28px}
.moves li{break-inside:avoid}
.moves button{display:flex;gap:8px;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;padding:5px 8px;cursor:pointer;color:var(--cream);font-size:12.5px;line-height:1.45}
.moves button::before{content:"▸";color:var(--acc);flex:none}
.moves button:hover{background:rgba(255,255,255,.03)}
.moves button.on{border-left-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent)}
.moves b{color:var(--acc)}
.ih{font-size:10px;letter-spacing:.14em;color:var(--amberd);text-transform:uppercase}
.it{font-weight:700;font-size:13px;color:var(--acc)}
.ii{font-size:12px;color:var(--dim);line-height:1.5}
.det{border-left:2px solid var(--acc);padding:4px 0 4px 10px;background:color-mix(in srgb,var(--acc) 6%,transparent)}
.det .how{font-size:12px;color:var(--cream);margin-top:2px}.det p{margin:4px 0 0;font-size:11.5px;color:var(--dim);line-height:1.5}








.cap-h{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.14em;color:var(--amberd);margin-bottom:8px;text-transform:uppercase}
.note{font-size:11px;color:var(--dim);margin:0 0 10px;line-height:1.5}
.grid{display:grid;grid-template-columns:10px repeat(16,var(--k));grid-template-rows:10px repeat(8,var(--k));gap:calc(var(--k)*.1)}
.num{font-size:8px;color:#5c5240;display:flex;align-items:center;justify-content:center}
.key{border:1px solid var(--line);background:var(--card2);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0;overflow:hidden;cursor:pointer;color:var(--cream);border-radius:0}
.key:hover{filter:brightness(1.35)}
.key.dark{background:transparent;border:1px dashed #241C12;cursor:default}
.key .t{font:700 calc(var(--k)*.22)/1.05 var(--fm)}
.key .s{font:400 calc(var(--k)*.17)/1.05 var(--fm);opacity:.75;margin-top:1px}
@container (max-width:620px){.key .s{display:none}}
.key.hold{background:var(--amber)!important;border-color:var(--amber)!important;color:#0A0908!important;box-shadow:0 0 8px var(--amber)}
.key.press{background:var(--cream)!important;border-color:var(--cream)!important;color:#0A0908!important;box-shadow:0 0 8px var(--cream)}
.key.picked{outline:2px solid var(--acc);outline-offset:1px}
.hn{font:700 calc(var(--k)*.36)/1 var(--fm)}
.lower{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.e16wrap{flex:none}
.layers{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.layers button{font-size:9.5px;letter-spacing:.06em;padding:3px 7px;background:none;border:1px solid var(--line);color:var(--dim);cursor:pointer;text-transform:uppercase}
.layers button[aria-pressed=true]{border-color:var(--ring);color:var(--ring)}
.e16{display:grid;grid-template-columns:repeat(4,var(--kn));gap:8px}
.knob{width:var(--kn);height:var(--kn);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card2);border:1px solid var(--ring,var(--line));text-align:center;padding:2px;cursor:pointer;color:var(--cream)}
.knob .t{font:700 max(9.5px,calc(var(--kn)*.2))/1.1 var(--fm)}.knob .s{font-size:max(7px,calc(var(--kn)*.13));line-height:1.1;color:var(--dim)}
.knob.empty{opacity:.25;cursor:default;border-style:dashed}
.knob.hl{background:var(--cream);border-color:var(--cream);color:#0A0908;box-shadow:0 0 8px var(--cream)}.knob.hl .s{color:#3A2E1E}
.knob.picked{outline:2px solid var(--acc);outline-offset:1px}
.knob .hn{font-size:12px}
.side{flex:1 1 200px;display:flex;flex-direction:column;gap:8px}
.cap{font-size:12px;line-height:1.5;color:var(--cream);min-height:40px}
.cap b{color:var(--acc);font-size:12.5px}.cap .how{color:var(--cream);margin-top:2px}.cap p{margin:4px 0 0;color:var(--dim)}
.cap.empty{color:var(--dim)}
.enote{font-size:10.5px;color:var(--dim);line-height:1.45}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--dim);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.legend b{color:var(--cream);margin-right:4px}
.legend i{display:inline-flex;width:13px;height:13px;vertical-align:-2px;margin-right:5px;align-items:center;justify-content:center;font:700 8px var(--fm);font-style:normal;color:#0A0908}
/* view toggle and cheat sheet */
.views{display:flex;border:1px solid var(--amberd)}
.views button{font-size:11px;letter-spacing:.08em;padding:6px 10px;background:none;border:0;color:var(--dim);cursor:pointer;text-transform:uppercase}
.views button+button{border-left:1px solid var(--amberd)}
.views button[aria-pressed=true]{background:var(--amber);color:#0A0908;font-weight:700}
.sheet{columns:3 400px;column-gap:16px}
.sheet>.frame{break-inside:avoid;margin-bottom:14px}
.sheet-app{grid-column:1/-1;margin:6px 0 10px;font:400 12px/1.3 "Press Start 2P",var(--fm);color:var(--sc)}
.cs{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:4px 12px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px dashed var(--line);padding:6px 8px;cursor:pointer;color:inherit}
.cs:last-child{border-bottom:0}
.cs:hover{background:rgba(255,255,255,.03)}
.combo{display:flex;flex-wrap:wrap;gap:3px;align-items:center;font-size:11px;color:var(--dim)}
.kc{display:inline-block;font:700 11px/1.35 var(--fm);padding:0 5px;border:1px solid var(--line);color:var(--cream);background:var(--card2);white-space:nowrap}
.kc.h{border-color:var(--amber);color:var(--amber)}
.kc.n{border-color:var(--cyan);color:var(--cyan)}
.kc.k{border-color:var(--cream);border-radius:9px}
.kc.r{border-color:var(--red);color:var(--red);border-radius:9px}
.eff{font-size:12px;color:var(--cream);line-height:1.4}.eff i{font-style:normal;color:var(--dim);font-size:10.5px}
.sheet-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11px;color:var(--dim);margin:0 0 12px}
@media(max-width:600px){.cs{grid-template-columns:minmax(0,1fr)}}
/* answers */
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.lbl{font-size:10px;letter-spacing:.24em;color:var(--amberd);text-transform:uppercase;margin:0}
.count{font-size:10px;color:var(--dim);letter-spacing:.08em}
.clear{font-size:10px;letter-spacing:.08em;margin-left:8px;padding:3px 8px;background:none;border:1px solid var(--amber);color:var(--amber);cursor:pointer;text-transform:uppercase}
.results{display:flex;flex-direction:column;gap:14px}
.results{display:block!important;columns:3 380px;column-gap:16px}
.results>.frame{break-inside:avoid;margin-bottom:14px}
.sec{--fc:var(--sc,var(--acc))}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 8px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--sc,var(--acc)) 7%,transparent)}
.sec-h h3{margin:0;font-size:12px;letter-spacing:.08em;color:var(--sc,var(--acc));text-transform:uppercase}
.sec-h span{font-size:9px;letter-spacing:.12em;color:var(--sc,var(--acc));opacity:.7;text-transform:uppercase}
.rows{padding:2px 6px 6px}
.row{display:grid;grid-template-columns:minmax(0,1fr);gap:1px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 8px;cursor:pointer;color:inherit;border-left:2px solid transparent}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(255,255,255,.025)}
.row.on{border-left-color:var(--sc,var(--acc));background:color-mix(in srgb,var(--sc,var(--acc)) 8%,transparent)}
.rt{font-weight:700;font-size:12.5px;color:var(--sc,var(--acc));letter-spacing:.02em}
.rw{font-size:12px;color:var(--cream)}
.rd{font-size:11.5px;color:var(--dim);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.on .rd,.row:focus-visible .rd{display:block}
.app{font-size:9.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.badge{display:inline-flex;align-items:center;padding:1px 7px 1px 5px;font-size:10px;font-weight:700;color:var(--amber);margin-left:6px;vertical-align:1px;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--amber) 22%,transparent))}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--amber);margin-right:5px;box-shadow:0 0 4px var(--amber)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--dim);border:1px solid var(--line);padding:1px 6px;margin-left:4px;white-space:nowrap;vertical-align:1px}
.chip::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 4px var(--cyan)}
mark{background:color-mix(in srgb,var(--amber) 28%,transparent);color:inherit;padding:0 1px}
.empty-state{padding:16px;color:var(--dim)}
.src{font-size:10px;color:var(--amberd);letter-spacing:.08em;margin-top:18px}
@media(max-width:700px){.bar{position:static}}
@media(max-width:600px){.page,.barin{padding-left:10px;padding-right:10px}h1{font-size:11px}.e16{grid-template-columns:repeat(4,42px)}.knob{width:42px;height:42px}}
@media(prefers-reduced-motion:no-preference){.row,.key,.knob{transition:background .12s,box-shadow .12s}}
</style>
</head>
<body>
<div class="bar" id="bar"><div class="barin">
  <h1>NORNS MANUAL</h1>
  <div class="search">
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="search: mutated mutes" aria-label="Search the manual">
    <button id="qx" type="button" aria-label="Clear search">×</button>
  </div>
  <div class="views" id="views" role="group" aria-label="View"><button type="button" data-v="sheet">Cheat sheet</button><button type="button" data-v="board">Full manual</button></div>
  <div class="chips" id="chips" role="group" aria-label="App"></div>
  <div class="tries" id="tries"><span>TRY</span></div>
</div></div>
<div class="page">
  <div class="main">
    <div id="sheetwrap" hidden>
      <div class="head"><p class="lbl" id="stitle">Cheat sheet</p><span class="count" id="scount"></span></div>
      <div class="sheet-key"><span><span class="kc h">DUB</span> hold</span><span><span class="kc">PAT</span> press</span><span>→ while holding, press</span><span><span class="kc">2× L1</span> double tap</span><span><span class="kc k">↻ FILT</span> turn knob</span><span><span class="kc k">● RVER</span> push knob</span><span><span class="kc n">K2</span> norns key or encoder</span><span>Tap a line to see it lit on the board.</span></div>
      <div class="sheet" id="sheet"></div>
    </div>
    <div class="boardcol" id="boardwrap" hidden>
      <div class="frame board"><i class="c1"></i><i class="c2"></i>
        <div class="cap-h"><span>GRID_128 / OXI_E16</span><span id="appcode"></span></div>
        <p class="note" id="note"></p>
        <div class="board-in">
          <div class="gridwrap"><div class="grid" id="grid"></div></div>
          <div class="e16col"><div class="layers" id="layers"></div><div class="e16" id="e16"></div><div class="enote" id="enote"></div></div>
        </div>
        <div class="info" id="insp"></div>
      </div>
    </div>
    <div class="anscol" id="anscol">
      <div class="head"><p class="lbl" id="rtitle">Everything</p><span class="count" id="count"></span></div>
      <div class="results" id="results"></div>
      <p class="src" id="src"></p>
    </div>
  </div>
</div>

<script>
{
/* ---------- grid layouts: put(row, col, label, sub, group, tint, info) ---------- */
const G = n => "var(--g-" + n + ")";
function blank(){ return Array.from({length:8}, () => Array(16).fill(null)); }
function P(g, r, c, t, s, grp, tint, i){ g[r-1][c-1] = { t, s, grp, tint, i }; }

function mutatedGrid(){
  const g = blank();
  for (let r = 1; r <= 6; r++) for (let c = 1; c <= 16; c++)
    P(g, r, c, c === 1 ? "T" + r : String(c), c === 1 ? "/T" + (r + 6) : "", "step", c % 4 === 1 ? .95 : .7,
      "Track row " + r + ": T" + r + " on page C, T" + (r + 6) + " on page T. Press an empty key to place a step, tap a placed step to clear it, hold steps and turn knobs to give them their own settings.");
  for (let c = 1; c <= 16; c++) P(g, 7, c, "C" + c, "", "cycle", .85, "Cycle row, cycle " + c + ". Lit cycles exist, dim ones are skipped, the playing one blinks. In cycle mode, press to edit that cycle.");
  P(g,8,1,"CLN","page C","nav",.85,"Track page C, the clean tracks T1 to T6. Hold and tap a track row to mute it. Press with TEX to open the slots.");
  P(g,8,2,"TEX","page T","nav",.85,"Track page T, the textured tracks T7 to T12. Hold and tap a track row to mute it. Press with CLN to open the slots.");
  ["1-16","17-32","33-48","49-64"].forEach((s,i) => P(g,8,4+i,String(i+1),s,"page",.85,"Step page " + (i+1) + ": shows steps " + s + " on every track row."));
  P(g,8,9,"LEN","length","mode",.85,"Hold and press a key in a track row to make it the last step. Hold and tap cycles to skip them. With DIR: cycle mode on or off.");
  P(g,8,10,"DIR","direction","mode",.85,"Hold and press key 1 to 4 in a track row: forward, backward, ping pong or random. With LEN: cycle mode on or off.");
  P(g,8,12,"▲","up","nav",.85,"Selects the track above when let go. With ▼ held too it is COPY.");
  P(g,8,13,"▼","down","nav",.85,"Selects the track below when let go. With ▲ held too it is COPY.");
  P(g,8,14,"TEMP","snap back","temp",.85,"Hold to try changes that snap back when you let go. Double tap to keep it on.");
  P(g,8,15,"REC","record","rec",.85,"Hold and turn knobs to record their movement. Double tap to keep it on. Also deletes cycles and slots when held with them.");
  P(g,8,16,"ALT","layer 2","alt",.85,"Switches the E16 between its two layers of knobs.");

 ["Recording knob movement","Step, exact or soft playback","Hold REC (or have it on), turn norns E3.","STEP jumps between values, EXACT plays it as played (the default), SOFT 1 to 100% smooths it like a slow fader. Each track keeps its own.",{hold:[[8,15]],norns:"E3",tags:"smooth glide automation"}],
 ["Mutes and whole pages","Mute or unmute a track","Hold CLN or TEX, tap anywhere in the track's row.","Holding TEX switches to page T, so you can mute textured tracks from anywhere. While held, rows light as bars: bright plays, dim muted. Muted steps show dim the rest of the time. Mutes are saved with the song.",{hold:[[8,1]],press:[[3,6]],tags:"mute unmute silence solo"}],
 ["Mutes and whole pages","Change every track on a page","With TEMP on, hold CLN or TEX and turn E16 knobs.","Each track moves by the same amount from its own setting. It snaps back when TEMP ends; keep it with the keep combo under Slots. Without TEMP, nothing changes.",{badge:"TEMP on",hold:[[8,1]],knob:[9,"turn"],tags:"page all tracks macro"}],
 ["Mutes and whole pages","Shift every pattern on a page","With TEMP on, hold a page key, turn knob 13.","ROT for every track on that page, clean and textured.",{badge:"TEMP on",hold:[[8,2]],knob:[13,"turn"],tags:"rotate rot page"}],
 ["Mutes and whole pages","Which knobs change a whole page","Nothing to press.","Every page: VEL, STRT, END, ATK, REL, DLY, RVB, FILT, RES, DIST, TONE, and on ALT: RAND, CHNC, PTCH, SWNG, VRND. Page T only: SIZE, SMER, DRFT, SAMT, CHAR. One track at a time only: SLCS, SLCE, SCAL, TIME, MUTA, SLOT, ROOT.",{tags:"page knobs list"}],
 ["Slots","Open or close the slots","Press CLN and TEX together.","The top row shows the 16 slots and stays open after you let go. Press CLN or TEX to close. Full slots are lit, yours brightest, empty ones faint.",{press:[[8,1],[8,2]],same:true,tags:"slot song save"}],
 ["Slots","Save a song into a slot","With slots open, press an empty slot.","The song now belongs to that slot. Pressing its own slot saves it again.",{badge:"slots open",press:[[1,4]],tags:"save store slot"}],
 ["Slots","Switch songs","With slots open, press a full slot.","While playing it switches at the next bar (16 steps) and blinks until then; stopped, at once. The song you leave is saved first. The screen shows the slot, such as S3. Switching waits while TEMP is on.",{badge:"slots open",press:[[1,3]],tags:"load switch song slot"}],
 ["Slots","Delete a slot","With slots open, hold the slot and tap REC.","",{badge:"slots open",hold:[[1,3]],press:[[8,15]],tags:"delete remove clear slot"}],
 ["TEMP","Try changes, then snap back","Hold TEMP while changing things.","Everything snaps back when you let go. The E16 rings rest pink.",{hold:[[8,14]],knob:[9,"turn"],tags:"temp temporary undo"}],
 ["TEMP","Keep TEMP on","Double tap TEMP.","Tap it again to go back to how things were.",{press:[[8,14],[8,14]],same:true,x2:true,tags:"temp latch"}],
 ["TEMP","Save the TEMP version as a new song","TEMP on, open the slots, press an empty slot.","TEMP stays on, and when it ends the song goes back to the slot you were on.",{badge:"TEMP on, slots open",press:[[1,4]],tags:"save temp"}],
 ["TEMP","Keep the TEMP changes","TEMP on, open the slots, press this song's slot.","Saved there, and TEMP ends without snapping back. Other full slots aren't touched while TEMP is on.",{badge:"TEMP on, slots open",press:[[1,3]],tags:"keep save temp"}],
 ["Saving","Save a song by name (PSET)","norns PARAMETERS, then PSET, then SAVE.","A PSET keeps the whole song, like a slot, plus the norns menu settings. Loading one saves the song you leave to its own slot first.",{tags:"pset save name"}],
 ["Saving","Save a new numbered PSET","PARAMETERS, then save new PSET (the first item).","Saves into the slot after the highest in use, named MUTATED plus the slot number (MUTATED 002 in slot 2). No typing; the name always matches the slot. Slot 1 stays INT.",{cheat:true,menu:"PARAMETERS › save new PSET",tags:"pset save new number name slot quick"}],
 ["Saving","Start from a blank song","Load PSET 1, INT.","INT is a blank song: no steps, one cycle, starting settings and starting samples. Save it as a new PSET to keep INT clean.",{tags:"new blank empty init int"}],
 ["Saving","Where things are saved","Automatically.","Everything saves to dust/data/mutated/state.data; slots in dust/data/mutated/presets, one file per slot.",{tags:"autosave file data"}],
 ["Audio and setup","Record the norns's audio","Hold E16 knob 16 for a second. Again to stop.","Takes are saved as numbered WAVs in dust/audio/tape.",{knob:[16,"push"],tags:"record tape bounce wav"}],
 ["Audio and setup","Delay and reverb settings","PARAMETERS, then mutated delay and reverb.","Delay time, delay repeats, reverb decay, reverb tone and reverb size.",{tags:"delay reverb settings"}],
 ["Audio and setup","Clicks at the start or end of hits","PARAMETERS, snap to zero crossings.","On by default: starts and ends move to the nearest zero crossing so cuts don't click. Works on WAVs.",{tags:"click pop zero crossing"}],
 ["Audio and setup","Watch the processor load","Look at the bottom line of the screen.","CPU shows when there's room, and always at 75% or more in bright white. Around 90% the sound can crackle.",{tags:"cpu crackle glitch"}],
 ["Audio and setup","Set up the E16","Load e16/norns-rings-compact.lua into the NORNS scene's script in the OXI App.","Set each knob's push action to Script, with the knob's own number as its ID. Load it again after updating Mutated.",{tags:"oxi e16 script setup"}]
],
cb: [
 ["How it works","How a strip works","Nothing to press.","Each of rows 1 to 4 is a strip: loop, filter, delay, smear, grain, distortion, slot, Out. Cables carry sound between keys and only what reaches Out is heard. A cable from the loop straight to Out plays it untouched. Feedback happens when cables form a circle.",{tags:"explain strip network"}],
 ["Patching","Plug or unplug a cable","Hold the key where it starts, tap the key where it lands.","Doing it again unplugs it. New cables start at 90 percent. A loop only sends and Out only receives.",{hold:[[1,1]],press:[[1,3]],tags:"cable patch connect plug unplug"}],
 ["Patching","Run a cable to another strip","Hold a key in one row, tap a key in another row.","For example, hold loop 2's key and tap the delay in row 1: loop 2 plays through strip 1's delay.",{hold:[[2,1]],press:[[1,3]],tags:"cable cross strip"}],
 ["Patching","Feed a box into itself","Double tap the box.","Double tap again to unplug it.",{press:[[1,3],[1,3]],same:true,x2:true,tags:"feedback self cable"}],
 ["Patching","Unplug a whole strip","Hold DUB and SPD, press any key of the strip: its loop key, a box, OUT or PLAY.","Every cable touching the strip is unplugged at once, including cables to other strips. The key you press does nothing else: no cable is plugged and no loop starts or stops. Keep holding both to clear several strips.",{hold:[[6,13],[6,14]],press:[[1,5]],anyZone:["loop","box","out","play"],tags:"clear unplug reset delete cables strip clr"}],
 ["Patching","Set a cable's level","Hold its start key and landing key, turn CABL (knob 2).","Letting go after turning only sets the level.",{hold:[[1,1],[1,3]],knob:[2,"turn"],tags:"cable level volume"}],
 ["Patching","Set a box's self cable level","Hold just that box, turn CABL.","",{hold:[[1,3]],knob:[2,"turn"],tags:"feedback level cable"}],
 ["Patching","Read what's plugged in","Hold any key.","It shows full brightness, the keys it sends to light up (brighter for louder cables), everything else dims. Boxes in a feedback circle are brighter.",{hold:[[1,4]],tags:"view cables see"}],
 ["Playing","Play or stop a loop","Press PLAY (column 16) or norns K2.","Continuous loops start or stop. Triggered loops play while you hold PLAY.",{press:[[1,16]],tags:"play start stop"}],
 ["Playing","Continuous or triggered","Double tap the loop key.","Switches the loop between continuous and triggered.",{press:[[1,1],[1,1]],same:true,x2:true,tags:"mode trigger gate continuous"}],
 ["Playing","Transpose a loop","Press a key in its pitch row (row 5 for loop 1 to row 8 for loop 4).","Two octaves down to two octaves up in fifths and octaves; column 5 is the original pitch. It works like tape: up an octave plays twice as fast. Patterns record it.",{press:[[5,7]],tags:"pitch transpose octave tune"}],
 ["Playing","Silence everything","Press PANIC or norns K3.","Drains every box for two and a half seconds. Cables stay plugged in. Empties the reverb too.",{press:[[8,16]],norns:"K3",tags:"panic stop silence emergency"}],
 ["Playing","Shape how a loop starts and stops","Page 3 (PG3): norns E2 chooses attack, decay, sustain or release, E3 sets it.","A slow attack fades in, a long release rings out. Starting values: 0.12 s, 0.3 s, 75 percent, 3.5 s. A new file resets them.",{press:[[8,13]],norns:"E2 / E3",tags:"envelope attack release adsr fade"}],
 ["Playing","Set a loop's start and end","Page 2 (PG2): norns E2 moves the start, E3 the end.","They never cross; a loop is at least 20 ms.",{press:[[8,12]],norns:"E2 / E3",tags:"loop start end trim"}],
 ["Playing","Choose a loop file","Page 4 (PG4): norns E2 picks the folder, E3 the file.","Loops live in dust/audio/material, shared by all four apps; the list also has the tape recordings and Fractured's captures. A file loads when you stop turning, with its start, end and envelope reset.",{press:[[8,14]],norns:"E2 / E3",tags:"load sample file browser"}],
 ["Patterns","Record a pattern","Press an empty pattern key, play, press it again.","Recording starts with your first move and it loops right away. Patterns record loops started and stopped, cables, E16 settings and loop start and end.",{press:[[1,11]],tags:"pattern record loop"}],
 ["Patterns","Stop or play a pattern","Press it.","Stopping a pattern also stops a triggered loop it was playing.",{press:[[1,11]],tags:"pattern stop play"}],
 ["Patterns","Overdub a pattern","Hold DUB, press a playing pattern.","Press the pattern again to finish.",{hold:[[6,13]],press:[[1,12]],tags:"overdub dub add"}],
 ["Patterns","Change a pattern's speed","Hold SPD, press the pattern.","Steps through normal, half, quarter and double.",{hold:[[6,14]],press:[[1,12]],tags:"speed half double"}],
 ["Patterns","Clear a pattern","Hold DUB, then SPD too, press the pattern.","It empties at once and silently. Keep holding both to clear several. The same chord on a strip key unplugs that strip.",{hold:[[6,13],[6,14]],press:[[1,12]],tags:"clear delete erase pattern"}],
 ["Patterns","What a pattern changes","Nothing to press.","A pattern only owns what it changes: each pass, its cables and settings go back to where they were when it first touched them. Everything else is yours, so you can rewire while it plays. Knobs a playing pattern moves show red on the E16.",{tags:"explain pattern"}],
 ["Slot effect","Change a strip's slot effect","Press PG1, tap any key in the strip's row once, turn norns E2.","Freezer, stutter, shimmer or resonator. Cables and settings stay and it can change while playing. Tap only once: a double tap feeds a box into itself.",{press:[[8,11],[2,7]],norns:"E2",tags:"slot effect freezer stutter shimmer resonator"}],
 ["Slot effect","Set the resonator's key","On the network page, turn norns E3.","",{badge:"resonator in the slot",norns:"E3",tags:"resonator key root"}],
 ["Slot effect","What each slot effect does","Nothing to press.","Freezer (FRZ) holds a moment as a drone and follows its loop. Stutter (STU) repeats the latest fragment four times. Shimmer (SHM) is a reverb blooming up an octave. Resonator (RES) is six tuned strings that ring along.",{tags:"freezer stutter shimmer resonator explain"}],
 ["Slot effect","The freezer glitches the sound","PARAMETERS, freezer: smooth, medium or light.","Smooth is the default and fine on a Pi 4. On a Pi 3B+, medium or light avoid glitching.",{tags:"freezer cpu glitch pi"}],
 ["Feedback","Tame feedback in a strip","Turn FDBK (knob 3).","Turns down every feedback cable in the strip at once, leaving the main path playing.",{knob:[3,"turn"],tags:"feedback trim too loud"}],
 ["Feedback","Ringing tones or long echoes","PARAMETERS, lap time.","How long a return cable waits before sound comes back, 20 ms to 1 s (0.35 s default). Short laps ring like strings; long uneven laps make evolving echoes.",{tags:"lap time feedback pitch"}],
 ["Feedback","Too quiet","Raise the norns LEVELS output, or PARAMETERS output level.","Output level runs 12 dB down to 6 dB up. The output is turned down 8 dB after the limiter to leave room.",{tags:"volume quiet loud output level"}],
 ["Reverb","Send a strip to the reverb","Turn RVRB (knob 4).","Each strip sends its own amount, taken from what reaches its Out. The reverb never feeds back into the network.",{knob:[4,"turn"],tags:"reverb send"}],
 ["Reverb","Shape the reverb","PARAMETERS, reverb.","Decay 0.3 to 20 s (3.5 default), tone dark, warm or bright, and size.",{tags:"reverb decay tone size"}],
 ["Screen","Change screen pages","Press PG1 to PG4, or turn norns E1.","Network, loop, envelope, files.",{press:[[8,11]],norns:"E1",tags:"page screen"}],
 ["Saving","Save a sound (PSET)","norns PARAMETERS, then PSET, then SAVE.","Keeps every setting of all four strips, the reverb, the cables and all sixteen patterns.",{tags:"pset save load"}],
 ["Saving","Save a new numbered PSET","PARAMETERS, then save new PSET (the first item).","Saves into the slot after the highest in use, named CIRCUIT BREAK plus the slot number (CIRCUIT BREAK 002 in slot 2). No typing; the name always matches the slot. Slot 1 is kept for INT.",{cheat:true,menu:"PARAMETERS › save new PSET",tags:"pset save new number name slot quick"}],
 ["Saving","Autosave","Automatically.","Saves when the script closes and every three minutes while you play.",{tags:"autosave"}],
 ["Audio and setup","Record the norns's audio","Hold E16 knob 16 for a second. Again to stop.","The E16 title shows REC and the time. Takes go to dust/audio/tape.",{knob:[16,"push"],tags:"record tape bounce wav"}],
 ["Audio and setup","Keep knob names showing","PARAMETERS, EDIT, readings on moves (under e16): off.","Turning a knob still shows its reading.",{tags:"e16 readings names"}]
],

still: [
 ["Playing a voice","Sound a voice","Hold a key in its row (rows 1 to 6).","It sounds from that position and crawls on at its stretch. Column 1 is the start of the sound, column 16 the end. Playing a row selects that voice for the E16.",{hold:[[3,6]],tags:"play hold voice"}],
 ["Playing a voice","Latch a voice","Double tap a key in its row.","It keeps sounding. Double tap again, press K3, or press STOP to release.",{press:[[3,6],[3,6]],same:true,x2:true,tags:"latch hold sustain"}],
 ["Playing a voice","Travel between two positions","Hold one key, press a second in the same row.","The voice moves back and forth between them, and knob 9 becomes TIME.",{hold:[[3,4]],press:[[3,10]],tags:"travel scan between two"}],
 ["Playing a voice","Keep traveling, hands free","Hold one key, double tap the second.","It keeps traveling after you let go. A latched voice given a second key does too.",{hold:[[3,4]],press:[[3,10],[3,10]],same:true,x2:true,tags:"travel latch"}],
 ["Playing a voice","Set the travel time","While traveling, turn knob 9 (TIME).","How long one move from one key to the other takes, a quarter second to two minutes.",{badge:"traveling",knob:[9,"turn"],tags:"time travel speed"}],
 ["Playing a voice","Move a latched voice","Press another key in its row.","It jumps there and stays latched.",{badge:"latched",press:[[3,10]],tags:"jump move position"}],
 ["Playing a voice","Choose the voice the E16 controls","Press its select key (row 8, keys 1 to 6).","Without playing it. The selected row glows faintly.",{press:[[8,3]],tags:"select voice e16"}],
 ["Playing a voice","Latch or release the selected voice","Press norns K3.","",{norns:"K3",tags:"latch release"}],
 ["Playing a voice","Release every voice","Press STOP.","",{press:[[8,16]],tags:"stop release panic silence all"}],
 ["Stretch and freeze","Stretch further or less","Turn STCH (knob 9).","Fully left plays at normal speed. Turning right stretches, up to 1000 times. The last few steps are frozen and read FRZ.",{knob:[9,"turn"],tags:"stretch slow speed"}],
 ["Stretch and freeze","Freeze a voice","Push STCH (knob 9).","Push again to let it crawl. Turning STCH or TIME also unfreezes.",{knob:[9,"push"],tags:"freeze frozen hold"}],
 ["Stretch and freeze","Change pitch","Turn PTCH (knob 3).","Octaves and fifths, two octaves each way. Off pitch, the label shows it, such as -12.",{knob:[3,"turn"],tags:"pitch transpose octave"}],
 ["Stretch and freeze","Back to original pitch","Push PTCH (knob 3).","",{knob:[3,"push"],tags:"pitch reset"}],
 ["Stretch and freeze","Nudge the position","Turn POS (knob 4).","Up to half a key either way.",{knob:[4,"turn"],tags:"fine position nudge"}],
 ["Spray","Spray","With the voice sounding, hold its select key (row 8), then hold a key in its row.","Grains scatter from the voice's place out as far as that key, and the same distance the other way, for as long as you hold. One key away shimmers; far away reaches most of the sound. Let go and they settle back. Grains never land past key 1 or key 16.",{badge:"voice sounding",hold:[[8,3],[3,12]],tags:"spray scatter throw both hands"}],
 ["Spray","Spray into other rows (REACH)","Hold the voice's select key, turn knob 14.","RECH: how many neighboring rows a spray reaches into, 0 to 5, stopping at rows 1 and 6. The reached rows flicker dimly.",{hold:[[8,3]],knob:[14,"turn"],layer:"Select held",tags:"reach rech spray rows"}],
 ["Spray","How much comes from those rows (MIX)","Hold the voice's select key, turn knob 15.","MIX: how many of the spray's grains come from the reached rows, shared equally.",{hold:[[8,3]],knob:[15,"turn"],layer:"Select held",tags:"mix spray"}],
 ["Spray","How fast it settles (SETL)","Hold the voice's select key, turn knob 16.","SETL: how long sprayed grains take to settle back, 0.05 s to 10 s.",{hold:[[8,3]],knob:[16,"turn"],layer:"Select held",tags:"settle setl spray"}],
 ["Spray","Play spray from a pattern","Record sprays into a pattern, then hold select and turn REACH, MIX or SETL while it plays.","The main way to play spray: the pattern sprays, your hands shape it.",{badge:"pattern playing sprays",hold:[[8,3]],knob:[14,"turn"],layer:"Select held",tags:"spray pattern"}],
 ["Sound","Bring up quiet tails (LIFT)","Hold the voice's select key, turn knob 13.","Turns the voice up where its sound is quiet, toward its loudest part. 0 leaves it alone.",{hold:[[8,3]],knob:[13,"turn"],layer:"Select held",tags:"lift quiet tail boost compress"}],
 ["Sound","Load a sound into a voice","Select the voice, press and let go of norns K2, choose a file.","Turn E3 right to preview; while a preview plays, E2 plays each sound you scroll to. Preview level is in PARAMETERS.",{norns:"K2, let go",tags:"load sample file browser preview audition"}],
 ["Sound","Step through sounds in the folder","Turn norns E2.","The selected voice steps through the other sounds in its folder.",{norns:"E2",tags:"next sound scroll"}],
 ["Sound","Why the keys skip silence","Nothing to press.","When a sound loads, silence at each end is trimmed (judged 60 dB below its peak for WAVs), keeping fading tails and fade ins. The 16 keys cover only what's left.",{tags:"trim silence explain"}],
 ["LOOM","Go into LOOM mode","Select the voice, press LOOM (row 8, key 12).","Renders part of the voice's sound as a new stretched file, in the background. The screen shows a bright LOOM bar with seconds in, seconds out and about how long it will take. The key blinks slowly; the E16 rests light blue.",{press:[[8,3],[8,12]],tags:"loom render stretch mode"}],
 ["LOOM","Choose the part","Hold two keys in the voice's row, or turn STRT and END (knobs 1 and 2).","One key alone moves the part there, keeping its length. The part lights on the row and shows bracketed on screen. Each sound remembers its part.",{badge:"LOOM mode",hold:[[3,4]],press:[[3,8]],tags:"part region select loom"}],
 ["LOOM","Listen in LOOM","Press the voice's select key.","LOOM is silent until you ask. The original plays the part over and over at normal speed; a draft plays through from the start. Press again to stop.",{badge:"LOOM mode",press:[[8,3]],tags:"listen hear preview loom"}],
 ["LOOM","Set the stretch","Turn STCH, SCAT, WEAV and DRFT (knobs 9 to 12).","STCH 2x to 2000x, SCAT and DRFT 0 to 100%, WEAV 1 to 16. More WEAV takes longer to render. PTCH sets the pitch it renders at.",{badge:"LOOM mode",knob:[9,"turn"],layer:"LOOM mode",tags:"stretch scatter weave drift loom"}],
 ["LOOM","Render","Press norns K3.","Runs in the background, quiet while rendering; the key blinks fast and the screen shows the percent. When done, the draft plays.",{badge:"LOOM mode",norns:"K3",tags:"render bounce loom"}],
 ["LOOM","Play the draft from a key","Press a key in the voice's row.","While you're hearing the draft, the row plays it from that key. STRT and END still choose the part for the next render.",{badge:"draft ready",press:[[3,9]],tags:"draft play loom"}],
 ["LOOM","Render again","Press norns K3 again.","Replaces the draft.",{badge:"draft ready",norns:"K3",tags:"again redo loom"}],

function stem(w){ return w.replace(/(ing|ed|es|s)$/,"").replace(/(.)\1$/,"$1"); }
function variants(w){
  const base = SYN[w] || SYN[stem(w)] || [];
  const st = stem(w);
  return [...new Set([w, st.length >= 3 ? st : w, ...base])];
}
function parse(q){
  let app = null; const toks = [];
  q.toLowerCase().replace(/[^\w\s▲▼]/g," ").split(/\s+/).filter(Boolean).forEach(w => {
    if (APPWORD[w] && !app) { app = APPWORD[w]; return; }
    if (STOP.has(w)) return;
    if (w.length < 2) return;
    toks.push(w);

}
const W = {t:6,tags:5,how:3,d:1};
function wordHit(hay, v){ return v.length <= 3 ? new RegExp("\\b" + v.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "\\b").test(hay) : hay.includes(v); }
function score(e, toks){
  let total = 0, all = true;
  for (const tk of toks){
    const vs = variants(tk); let best = 0;
    for (const f in W) for (const v of vs) if (wordHit(e.hay[f], v)) best = Math.max(best, W[f] * (v === tk ? 1 : .8));
    if (!best) all = false;
    total += best;
  }
  if (e.kref) total *= .7;
  return {total, all};
}

/* keys that work the same way share a zone, so a move shown on one example key belongs to all of them */
function zone(app, r, c){
  if (app === "mutated"){ if (r <= 6) return "track"; if (r === 7) return "cycle"; if (c >= 4 && c <= 7) return "steppage"; }
  if (app === "cb"){
    if (r <= 4){ if (c === 1) return "loop"; if (c >= 2 && c <= 7) return "box"; if (c === 8) return "out"; if (c === 9) return "clr"; if (c >= 11 && c <= 14) return "pat"; if (c === 16) return "play"; }
    else if (c <= 9) return "pitch";
    if (r === 8 && c >= 11 && c <= 14) return "page";
  }
  if (app === "fractured"){
    if (c === 1) return "vel"; if (c >= 2 && c <= 8) return "kbd";
    if (r <= 4 && c >= 11 && c <= 14) return "pat"; if (r <= 4 && c === 16) return "loop";
    if (r === 5 && c >= 10) return "fader"; if (r === 6 && c >= 10 && c <= 12) return "sendsel";
    if (r === 8 && c >= 11 && c <= 14) return "page";
  }
  if (app === "still"){ if (r <= 6) return "voice"; if (r === 7) return "pat"; if (r === 8 && c <= 6) return "sel"; }
  return "k" + r + "," + c;
}
const GLYPH = {};
ORDER.forEach(app => {
  const z = {}; const add = (k, g) => { const id = zone(app, k[0], k[1]); (z[id] = z[id] || new Set()).add(g); };
  ENTRIES.filter(e => e.app === app).forEach(e => {
    const h = e.hold || [], p = e.press || [];
    const combo = h.length && (p.length || e.knob || h.length > 1);

    (e.anyZone || []).forEach(id => (z[id] = z[id] || new Set()).add("+"));

function results(){

  let list, title, loose = false;
  if (toks.length){

    let hits = scored.filter(x => x.all && x.total > 0);
    if (!hits.length){ hits = scored.filter(x => x.total > 0); loose = true; }
    hits.sort((a,b) => b.total - a.total);
    list = hits.map(x => x.e);
    const words = [...new Set(toks.flatMap(t => [t, stem(t)]))].filter(w => w.length >= 3).sort((a,b) => b.length - a.length);
    if (words.length) markRe = new RegExp("(" + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|") + ")", "gi");
    title = (loose ? "Closest matches for " : "Results for ") + "“" + state.q.trim() + "”" + (app ? " in " + APPS[app].name : "");

    list = ENTRIES.filter(e => !app || e.app === app);

function drawBoard(){ drawGrid(); drawE16(); drawInsp(); }

/* ---------- cheat sheet: only the combinations and hidden moves ---------- */
const ZNAME = {track:"step", cycle:"cycle", steppage:"step page", loop:"loop key", box:"box", out:"OUT", clr:"CLR", pat:"pattern", play:"PLAY", pitch:"pitch key", page:"PG",
  vel:"velocity key", kbd:"note key", fader:"fader key", voice:"voice key", sel:"select key"};
function keyName(e, k){
  const z = zone(e.app, k[0], k[1]), g = APPS[e.app].grid()[k[0]-1][k[1]-1];
  if (e.app === "mutated" && k[0] === 1 && /slot/.test(e.badge || "")) return "slot";
  if (z === "page" || z === "steppage" || z === "sendsel" || z.startsWith("k")) return g ? (g.t || g.s) : "key";
  if (e.app === "fractured" && z === "loop") return "LOOP";
  return ZNAME[z] || (g && g.t) || "key";
}
function isCheat(e){
  if (e.kref) return false;
  if (e.cheat) return true;
  const h = e.hold || [], p = e.press || [];
  return h.length > 0 || e.x2 || p.length > 1 || (e.knob && e.knob[1] === "push") || (e.norns && /hold|\+|let go|right|K\d/i.test(e.norns));
}
function names(e, list){ const out = []; list.forEach(k => { const n = keyName(e, k); if (out[out.length-1] !== n) out.push(n); }); return out; }
function comboHTML(e){
  const h = names(e, e.hold || []), p = names(e, e.press || []), parts = [];
  const chip = (t, c) => '<span class="kc' + (c ? " " + c : "") + '">' + esc(t) + "</span>";
  if (h.length) parts.push(h.map((n, i) => chip(n + ((e.hold || []).length > h.length && i === h.length - 1 && !/^[A-Z▲▼]/.test(n) ? "s" : ""), "h")).join(" + "));
  let pr = "";
  if (p.length){
    const more = (e.press || []).length > p.length && !e.x2 && !e.same;
    if (e.x2) pr = chip("2× " + p[0]);
    else if (e.same) pr = p.map(n => chip(n)).join(" & ");
    else pr = p.map((n, i) => chip(n + (more && i === p.length - 1 && !/^[A-Z▲▼]/.test(n) ? "s" : ""))).join(" then ");
    if (more && p.length === 1 && /^[a-z]/.test(p[0]) && (e.press || []).length > 2 && /then/i.test(e.how)) pr = chip(p[0]) + " then " + chip(p[0] + "s");
  }
  if (pr) parts.push((h.length ? "→ " : "") + pr);
  if (e.knob){
    const layer = e.layer || Object.keys(E16[e.app])[0], kn = E16[e.app][layer][e.knob[0]-1][0];
    const rec = e.knob[0] === 16 && e.knob[1] === "push" && /tape|record/i.test(e.t);
    let t;
    if (rec) t = "● hold knob 16, 1 sec";
    else if (/changing|change anything/i.test(e.how)) t = "change anything";
    else if (/knobs\b|any knob/i.test(e.how)) t = e.knob[1] === "turn" ? "↻ any knob" : "● any knob";
    else if (/that knob/i.test(e.how)) t = "● that knob";
    else if (e.app === "mutated" && e.knob[0] === 13 && /ROT/.test(e.d + e.t)) t = "↻ ROT (knob 13)";
    else t = (e.knob[1] === "turn" ? "↻ " : "● ") + kn;
    parts.push((h.length || pr ? (h.length && !pr ? "→ " : "+ ") : "") + chip(t, rec ? "r" : "k") + (layer !== Object.keys(E16[e.app])[0] && layer !== "Select held" ? ' <i>(' + esc(layer) + ")</i>" : ""));
  }
  if (e.norns) parts.push((parts.length ? "+ " : "") + chip(e.norns, "n"));
  if (e.menu) parts.push(chip(e.menu, "n"));
  return parts.join(" ");
}
function drawSheet(){
  const apps = state.app ? [state.app] : ORDER;
  let h = "", count = 0;
  apps.forEach(a => {
    const mine = ENTRIES.filter(e => e.app === a && isCheat(e));
    count += mine.length;
    if (!state.app) h += '<div class="sheet-app frame sec" style="--sc:' + ACC[a] + ';padding:10px 14px;break-inside:avoid"><i class="c1"></i><i class="c2"></i>' + esc(APPS[a].name.toUpperCase()) + "</div>";
    [...new Set(mine.map(e => e.s))].forEach(s => {
      const items = mine.filter(e => e.s === s);
      h += '<section class="frame sec" style="--sc:' + ACC[a] + '"><i class="c1"></i><i class="c2"></i><div class="sec-h"><h3>' + esc(s) + "</h3><span>" + (state.app ? items.length : esc(APPS[a].name)) + '</span></div><div class="rows">' +
        items.map(e => '<button type="button" class="cs" data-id="' + e.id + '"><span class="combo">' + comboHTML(e) + '</span><span class="eff">' + esc(e.t) + (e.badge ? " <i>(" + esc(e.badge) + ")</i>" : "") + "</span></button>").join("") + "</div></section>";
    });
  });
  $("sheet").innerHTML = h;
  $("stitle").textContent = state.app ? APPS[state.app].name + ": cheat sheet" : "Cheat sheets: all apps";
  $("scount").textContent = count + " COMBOS";
}
function setHash(){
  const h = (state.app || "") + (state.view === "board" ? (state.app ? "-full" : "full") : "");
  try { history.replaceState(null, "", h ? "#" + h : location.pathname); } catch (err) {}
  try { localStorage.setItem("norns-manual-view", state.view); } catch (err) {}
}
function renderAll(){
  const a = state.app;
  $("chips").innerHTML = [["", "All apps"], ...ORDER.map(k => [k, APPS[k].name])].map(([k,n]) => '<button type="button" data-app="' + k + '" aria-pressed="' + ((state.app || "") === k) + '" style="--c:' + (k ? ACC[k] : "var(--amber)") + '">' + esc(n) + "</button>").join("");
  const sheet = state.view === "sheet";
  $("views").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.view));
  $("sheetwrap").hidden = !sheet; $("anscol").hidden = sheet;
  $("boardwrap").hidden = !a || sheet;
  document.documentElement.style.setProperty("--acc", a ? ACC[a] : "var(--amber)");
  if (a){ $("note").textContent = APPS[a].note; $("appcode").textContent = CODE[a]; }
  $("src").textContent = a ? APPS[a].src : ORDER.map(k => APPS[k].src).join(" ");
  if (sheet){ drawSheet(); return; }
  if (a){ if (!E16[a][state.layer]) state.layer = Object.keys(E16[a])[0]; drawBoard(); }
  render();
}
function setApp(a){
  state.app = a || null; state.active = null; state.pick = null; state.layer = a ? Object.keys(E16[a])[0] : null;
  setHash();
  try { localStorage.setItem("norns-manual-app", a || ""); } catch (err) {}
  renderAll();
}
function choose(e, scroll){
  if (state.app !== e.app){ state.app = e.app; state.pick = null; }
  state.view = "board"; setHash();
  state.active = state.active === e.id ? null : e.id;
  const layers = Object.keys(E16[e.app]);
  state.layer = e.layer && E16[e.app][e.layer] ? e.layer : (state.layer && E16[e.app][state.layer] && !e.layer ? state.layer : layers[0]);
  renderAll();
  if (scroll && state.active != null){ const r = $("boardwrap").getBoundingClientRect(); if (r.top < 0 || r.top > innerHeight * .5) $("boardwrap").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"}); }
}

/* ---------- events ---------- */
$("tries").insertAdjacentHTML("beforeend", ["mutated mutes","copy a step","skip cycles","clear a pattern","circuit breaker feedback","still spray","loom keep","fractured undo","record knob movement","save song"].map(t => '<button type="button">' + esc(t) + "</button>").join(""));
$("tries").addEventListener("click", ev => { const b = ev.target.closest("button"); if (!b) return; $("q").value = b.textContent; onSearch(); $("q").focus(); });
let timer;
function onSearch(){
  state.q = $("q").value; state.active = null;
  const {app} = parse(state.q);
  if (state.q.trim()) state.view = "board";
  if (app && app !== state.app){ state.app = app; state.pick = null; state.layer = Object.keys(E16[app])[0]; }
  setHash();
  renderAll();
}
$("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(onSearch, 120); });
$("qx").addEventListener("click", () => { $("q").value = ""; onSearch(); $("q").focus(); });
$("views").addEventListener("click", ev => { const b = ev.target.closest("button"); if (!b) return; state.view = b.dataset.v; state.active = null; state.pick = null; setHash(); renderAll(); scrollTo(0, 0); });
$("sheet").addEventListener("click", ev => { const b = ev.target.closest(".cs"); if (!b) return; state.pick = null; state.active = null; choose(ENTRIES[+b.dataset.id], false); scrollTo(0, 0); });
$("chips").addEventListener("click", ev => { const b = ev.target.closest("button"); if (b) setApp(b.dataset.app); });
$("layers").addEventListener("click", ev => { const b = ev.target.closest("button"); if (!b) return; state.layer = b.dataset.l; drawE16(); });
$("grid").addEventListener("click", ev => {
  const b = ev.target.closest("button.key"); if (!b) return;
  const r = +b.dataset.r, c = +b.dataset.c, k = APPS[state.app].grid()[r-1][c-1];
  const same = state.pick && state.pick.type === "key" && state.pick.r === r && state.pick.c === c && state.active == null;
  state.active = null;
  state.pick = same ? null : {type:"key", r, c, title:"Row " + r + " key " + c + (k.t ? " (" + k.t + ")" : ""), info:k.i || ""};
  /* keys that change what the E16 does switch its layer, as on the hardware */
  const base = Object.keys(E16[state.app])[0];
  if (state.app === "mutated" && r === 8 && c === 16) state.layer = state.layer === "ALT layer" ? base : "ALT layer";
  else if (state.app === "still" && r === 8 && c <= 6) state.layer = same ? base : "Select held";
  else if (state.app === "still" && r === 8 && c === 12) state.layer = state.layer === "LOOM mode" ? base : "LOOM mode";
  drawBoard();
});
$("e16").addEventListener("click", ev => {
  const b = ev.target.closest("button.knob"); if (!b) return;
  const n = +b.dataset.n, k = E16[state.app][state.layer][n-1], base = E16[state.app][Object.keys(E16[state.app])[0]][n-1];
  const same = state.pick && state.pick.type === "knob" && state.pick.n === n && state.pick.layer === state.layer && state.active == null;
  state.active = null;
  state.pick = same ? null : {type:"knob", n, layer:state.layer, title:"Knob " + n + " (" + k[0] + ")", info:(k[2] || base[2] || k[1])};
  drawBoard();
});
$("insp").addEventListener("click", ev => { const b = ev.target.closest(".moves button"); if (!b) return; const e = ENTRIES[+b.dataset.id]; state.active = state.active === e.id ? null : e.id; if (e.layer && E16[e.app][e.layer]) state.layer = e.layer; drawBoard(); render();
  const g = $("grid").getBoundingClientRect(), top = $("bar").offsetHeight;
  if (state.active != null && (g.top < top || g.bottom > innerHeight)) $("grid").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"}); });
$("results").addEventListener("click", ev => { const b = ev.target.closest(".row"); if (!b) return; state.pick = null; choose(ENTRIES[+b.dataset.id], true); });
document.addEventListener("keydown", ev => { if (ev.key === "/" && document.activeElement !== $("q")){ ev.preventDefault(); $("q").focus(); } });
function fromHash(){ const h = location.hash.replace("#",""), full = /(^|-)full$/.test(h), a = h.replace(/-?full$/, ""); return {app: APPS[a] ? a : null, view: h ? (full ? "board" : "sheet") : null}; }
window.addEventListener("hashchange", () => { const h = fromHash(); if (h.app !== state.app || (h.view && h.view !== state.view)){ state.view = h.view || "sheet"; setApp(h.app); } });

const hs = fromHash();
let start = hs.app;
state.view = hs.view || "sheet";
if (!location.hash){ try { const s = localStorage.getItem("norns-manual-app"); if (APPS[s]) start = s; const v = localStorage.getItem("norns-manual-view"); if (v === "board" || v === "sheet") state.view = v; } catch (err) {} }
state.app = start; state.layer = start ? Object.keys(E16[start])[0] : null;
const setTop = () => document.documentElement.style.setProperty("--bartop", ($("bar").offsetHeight + 12) + "px");
new ResizeObserver(setTop).observe($("bar"));
new ResizeObserver(() => { if (state.app) drawPairs(); }).observe($("boardwrap"));
renderAll();
}
</script>
</body>
